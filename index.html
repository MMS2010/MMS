<!DOCTYPE html>
<html lang="ar">
<head>
    <link rel="icon" href="img.jpg">
    <meta charset="UTF-8">
    <style>
         body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: aliceblue;
         }
        .r {
            font-size: x-large;
        }
        .btn {
            display: flex;
            gap: 20px;
        }
        button {
            border: none;
            background-color: blue;
            color: white;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: large;
        }
        button:hover {
            cursor: pointer;
            transform: scale(1.09);
            transition: .3s;
        }
        button:focus {
            outline: none;
        }
        fieldset {
            margin-top: 12px;
            margin-right: 530px;
            margin-left:530px;
            border-radius: 20px;
            border-color: blue;
            border-width: 1px;
            height: 29px;
        }
        p {
            text-align: center;
            color: blue;
            margin-top: 5px;
        }
        .im {
            text-align: center;
            margin-bottom: 5px;
        }
        .im img {
            border-radius: 100%;
        }
        #btn ,
         #btn2 {
            background-color: white;
        }
        .bb {
            margin-left: 570px;
        }
        .select {
            text-align: center;
            margin-bottom: 15px;
        }
        .select select {
            border-radius: 12px;
            color: black; 
            padding: 5px 12px;
            font-size: large;
        }
       .select select:hover {
            cursor: pointer;
            background-color:#f3f3f3;
       }
       .select select:focus {
        outline: none;
       }
       option {
        background-color: white;
       }
       label {
        display: block;
        margin-top: 5px;
        color: blue;
        font-size: large;
       }
       input {
        margin-top: 6px;
        border-color: blue;
        border-width: 1px;
        border-radius: 7px;
        width: 3%;
        color: blue;
       }
       input:focus {
        outline: none;
       }
   </style>
    <title>برنامج سبحة</title>
</head>
<body>
    <button id="btn"><img src="light.svg" alt="light" title="Light" height="30" width="30"></button>
    <button id="btn2"><img src="dark.svg" alt="dark" title="Dark" height="30" width="30"></button>
    <p class="r">ده برنامج بسيط شغال زي السبحة</p>
    <div class="im">
    <img src="img.jpg" alt="سبحة" title="سبحة" height="110" width="100">
</div>
<div class="select">
<select id="sel">
    <option value="">سبحان الله</option>
    <option value="">الحمد لله</option>
    <option value="">الله أكبر</option>
</select>
<form>
    <label for="num">اكتب عدد مرات التسبيح</label>
    <input type="number" id="num">
</form>
</div>
<div class="bb">
    <div class="btn">
        <button type="reset" id="re"> اعاده الضبط</button>
        <button id="bt2">–</button>
    <button id="bt">+</button>
</div>
</div>
<br>
<fieldset>
    <p id="b">0</p>
</fieldset>
<script>
    let bt = document.getElementById("bt");
    let bt2 = document.getElementById("bt2");
    let b = document.getElementById("b");
    let re = document.getElementById("re");
    let btn = document.getElementById("btn");
    let btn2 = document.getElementById("btn2");
    let sound = new Audio("click.mp3");
    let sel = document.getElementById("sel");
    let num = document.getElementById("num");
    bt.addEventListener("click" , function () {
        sound.currentTime = 0;
        sound.play();
     b.textContent = Number(b.textContent) + 1;
     if (b.textContent == num.value) {
        alert("تمام انت كده خلصت ممكن تبدأ تاني");
        b.textContent = 0;
    }
    if (num.value == "") {
        alert("اكتب عدد التسبيح اولا");
        b.textContent = 0;
    }
    });
    bt2.addEventListener("click" , function () {
        b.textContent = Number(b.textContent) - 1;
        if (b.textContent <= 0) {
            b.textContent = 0;
        }
    });
    re.addEventListener("click" , function () {
      b.textContent = 0;
    });
    btn.addEventListener("click" , function () {
     document.querySelector("body").style.backgroundColor = "aliceblue";
     document.querySelector("p").style.color = "blue";
     document.querySelector("#bt").style.backgroundColor = "blue";
     document.querySelector("#bt").style.color = "white";
     document.querySelector("#bt2").style.backgroundColor = "blue";
     document.querySelector("#bt2").style.color = "white";
     document.querySelector("#re").style.backgroundColor = "blue";
     document.querySelector("#re").style.color = "white";
     document.querySelector("fieldset").style.borderColor = "blue";
     document.querySelector("#b").style.color = "blue";
     document.querySelector("label").style.color = "blue";
     document.querySelector("input").style.color = "blue";
     document.querySelector("input").style.borderColor = "blue";
     document.querySelector("select").style.borderColor = "black";
    });
    btn2.addEventListener("click" , function () {
     document.querySelector("body").style.backgroundColor = "black";
     document.querySelector("p").style.color = "white";
     document.querySelector("#bt").style.backgroundColor = "white";
     document.querySelector("#bt").style.color = "black";
     document.querySelector("#bt2").style.backgroundColor = "white";
     document.querySelector("#bt2").style.color = "black";
     document.querySelector("#re").style.backgroundColor = "white";
     document.querySelector("#re").style.color = "black";
     document.querySelector("fieldset").style.borderColor = "white";
     document.querySelector("#b").style.color = "white";
     document.querySelector("label").style.color = "white";
     document.querySelector("input").style.color = "black";
     document.querySelector("input").style.borderColor = "red";
     document.querySelector("select").style.borderColor = "red";
    });
    sel.addEventListener("change" , function () {
        b.textContent = "0";
    });
</script>
</body>
</html>
